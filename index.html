<title>Mind Map Explorer · Navnoor Bawa</title>

<style>
:root{
  --bg:#0e1116; --surface:#161b22; --surface-2:#1f2630; --border:#2a323d;
  --text:#e6edf3; --text-dim:#9da7b3; --accent:#4e79a7; --accent-2:#76b7b2;
  --warn:#e15759; --good:#59a14f;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:13px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,system-ui,sans-serif;overflow:hidden}
#app{display:flex;height:100vh}

/* --- sidebar --- */
#sidebar{width:360px;flex:none;border-right:1px solid var(--border);background:var(--surface);display:flex;flex-direction:column}
#sidebar header{padding:14px 16px;border-bottom:1px solid var(--border)}
#sidebar header h1{margin:0;font-size:15px;letter-spacing:.2px}
#sidebar header .sub{color:var(--text-dim);font-size:11.5px;margin-top:2px}
#sidebar header a{color:var(--accent-2);text-decoration:none}
#sidebar header a:hover{text-decoration:underline}
#search{margin:10px 12px;display:flex;gap:6px}
#search input{flex:1;background:var(--surface-2);border:1px solid var(--border);color:var(--text);padding:7px 9px;border-radius:6px;font-size:12.5px;outline:none}
#search input:focus{border-color:var(--accent)}
.tabs{display:flex;border-bottom:1px solid var(--border);background:var(--surface)}
.tab{flex:1;padding:8px 4px;text-align:center;font-size:11.5px;color:var(--text-dim);cursor:pointer;border-bottom:2px solid transparent;user-select:none}
.tab:hover{color:var(--text)}
.tab.active{color:var(--text);border-bottom-color:var(--accent)}
.panel{flex:1;overflow-y:auto;padding:8px 10px 60px 10px}
.filter-row{display:flex;flex-wrap:wrap;gap:5px;margin:6px 2px 10px 2px}
.pill{padding:3px 9px;border:1px solid var(--border);border-radius:999px;font-size:11px;color:var(--text-dim);background:var(--surface-2);cursor:pointer;user-select:none}
.pill:hover{color:var(--text)}
.pill.active{background:var(--accent);border-color:var(--accent);color:#fff}
.pill.cluster.active{color:#fff}
.thread{padding:8px 9px;border:1px solid var(--border);background:var(--surface-2);border-radius:7px;margin-bottom:6px;cursor:pointer;transition:background .12s}
.thread:hover{background:#222d39}
.thread.selected{border-color:var(--accent);background:#1a2533}
.thread .t-title{font-size:12.5px;font-weight:600;line-height:1.35}
.thread .t-meta{font-size:10.5px;color:var(--text-dim);margin-top:3px;display:flex;gap:8px;flex-wrap:wrap}
.thread .t-tags{margin-top:5px;display:flex;flex-wrap:wrap;gap:3px}
.tag{font-size:10px;padding:1px 6px;border-radius:3px;background:#243240;color:#cbd6e2}
.concept-row{padding:6px 8px;display:flex;justify-content:space-between;border-bottom:1px solid var(--border);cursor:pointer;font-size:12px}
.concept-row:hover{background:var(--surface-2)}
.concept-row.active{background:#1a2533;color:#fff}
.concept-row .c-count{color:var(--text-dim);font-size:11px}
.path{padding:8px 9px;border:1px solid var(--border);border-radius:7px;margin-bottom:8px;background:var(--surface-2);cursor:pointer}
.path:hover{background:#222d39}
.path.active{border-color:var(--accent)}
.path .p-name{font-size:12.5px;font-weight:600}
.path .p-meta{font-size:11px;color:var(--text-dim);margin-top:3px}
.quiz-card{padding:10px;border:1px solid var(--border);border-radius:7px;background:var(--surface-2);margin-bottom:8px}
.quiz-card .q-q{font-size:12.5px;font-weight:600}
.quiz-card .q-a{font-size:12px;color:var(--accent-2);margin-top:6px;display:none}
.quiz-card.reveal .q-a{display:block}
.quiz-card .q-actions{display:flex;gap:4px;margin-top:8px}
.btn{font-size:11px;padding:4px 8px;border:1px solid var(--border);border-radius:5px;background:var(--surface);color:var(--text-dim);cursor:pointer}
.btn:hover{color:var(--text);border-color:var(--accent)}

/* --- timeline --- */
#timeline{padding:10px 12px;border-top:1px solid var(--border);background:var(--surface)}
#timeline .tl-label{font-size:11px;color:var(--text-dim);display:flex;justify-content:space-between;margin-bottom:4px}
#timeline input[type=range]{width:100%}

/* --- stats panel --- */
.stat-section{margin-bottom:14px}
.stat-section h3{font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.5px;margin:0 0 6px 0;font-weight:600}
.bar-row{display:flex;align-items:center;gap:6px;margin:2px 0;font-size:11.5px}
.bar-row .bar-label{flex:none;width:135px;color:#cbd6e2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-row .bar-bg{flex:1;height:9px;background:var(--surface-2);border-radius:3px;overflow:hidden}
.bar-row .bar-fill{height:100%;border-radius:3px}
.bar-row .bar-val{flex:none;width:30px;text-align:right;color:var(--text-dim);font-size:10.5px}

/* --- related posts in detail panel --- */
.related-item{padding:5px 7px;margin:3px 0;border-radius:4px;cursor:pointer;font-size:11.5px;background:var(--surface-2);border:1px solid var(--border)}
.related-item:hover{background:#222d39}
.related-item .r-title{color:#cbd6e2;line-height:1.3}
.related-item .r-meta{color:var(--text-dim);font-size:10px;margin-top:2px}

/* --- graph --- */
#graph-container{position:relative;flex:1;overflow:hidden}
svg#graph{width:100%;height:100%;display:block;cursor:grab}
svg#graph:active{cursor:grabbing}
.link{stroke:#3a4554;stroke-opacity:.55}
.link.dimmed{stroke-opacity:.08}
.link.highlighted{stroke:#ffd166;stroke-opacity:.9}
.node circle{stroke:#0e1116;stroke-width:1.5px;cursor:pointer;transition:opacity .15s}
.node text{fill:var(--text);font-size:9.5px;pointer-events:none;paint-order:stroke;stroke:#0e1116;stroke-width:2.5px}
.node.concept circle{stroke-dasharray:none;opacity:.85}
.node.concept text{fill:#cbd6e2;font-size:9px;font-style:italic}
.node.dimmed circle,.node.dimmed text{opacity:.12}
.node.highlighted circle{stroke:#ffd166;stroke-width:2.5px}

#tooltip{position:absolute;pointer-events:none;background:rgba(20,25,33,.96);border:1px solid var(--border);padding:8px 10px;border-radius:6px;font-size:11.5px;max-width:280px;opacity:0;transition:opacity .12s}
#tooltip.show{opacity:1}
#tooltip .tt-title{font-weight:600;margin-bottom:3px}
#tooltip .tt-meta{color:var(--text-dim);font-size:10.5px}

#detail-panel{position:absolute;top:14px;right:14px;width:340px;max-height:calc(100vh - 28px);overflow-y:auto;background:rgba(20,25,33,.97);border:1px solid var(--border);border-radius:8px;padding:14px;display:none;box-shadow:0 8px 24px rgba(0,0,0,.4)}
#detail-panel.show{display:block}
#detail-panel .dp-close{position:absolute;top:8px;right:10px;cursor:pointer;color:var(--text-dim);font-size:16px}
#detail-panel h2{margin:0 18px 4px 0;font-size:14px;line-height:1.3}
#detail-panel .dp-meta{font-size:11px;color:var(--text-dim);margin:4px 0 10px 0;display:flex;gap:10px;flex-wrap:wrap}
#detail-panel .dp-summary{font-size:12px;color:#cbd6e2;margin-bottom:10px}
#detail-panel .dp-section{font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.5px;margin:10px 0 5px}
#detail-panel a.dp-link{display:inline-block;margin-top:6px;color:var(--accent-2);font-size:12px;text-decoration:none}
#detail-panel a.dp-link:hover{text-decoration:underline}

#legend{position:absolute;bottom:14px;left:14px;background:rgba(20,25,33,.92);border:1px solid var(--border);border-radius:7px;padding:8px 10px;font-size:11px;max-width:230px}
#legend .lg-row{display:flex;align-items:center;gap:6px;margin:2px 0;cursor:pointer;user-select:none;opacity:.85}
#legend .lg-row:hover{opacity:1}
#legend .lg-row.muted{opacity:.35}
#legend .lg-dot{width:9px;height:9px;border-radius:50%}

#controls{position:absolute;bottom:14px;right:14px;display:flex;gap:6px}
#controls button{font-size:11px;padding:5px 9px;border-radius:5px;border:1px solid var(--border);background:rgba(20,25,33,.92);color:var(--text-dim);cursor:pointer}
#controls button:hover{color:var(--text);border-color:var(--accent)}
#controls button.on{color:var(--accent);border-color:var(--accent)}

#topbar{position:absolute;top:14px;left:14px;background:rgba(20,25,33,.92);border:1px solid var(--border);border-radius:7px;padding:6px 12px;font-size:11.5px;color:var(--text-dim)}
#topbar b{color:var(--text)}

::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#2a323d;border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:#3a4554}
</style>
</head>

</div>

<script>
const DATA = JSON.parse(document.getElementById("dataset").textContent);

const state = {
  tab: "posts",
  searchTerm: "",
  diff: "all",
  cluster: null,
  activeConcept: null,
  activePath: null,
  selectedThread: null,
  showConcepts: true,
  showLabels: true,
  mutedClusters: new Set(),
  fromDate: null,    // ISO yyyy-mm-dd; null = no lower bound
  hoverThread: null,
};

// Pre-compute adjacency for fast neighbor lookup on hover.
const NEIGHBORS = new Map();   // id -> Set of neighbor ids (threads only)
DATA.edges.forEach(e=>{
  if(!NEIGHBORS.has(e.source)) NEIGHBORS.set(e.source,new Set());
  if(!NEIGHBORS.has(e.target)) NEIGHBORS.set(e.target,new Set());
  NEIGHBORS.get(e.source).add(e.target);
  NEIGHBORS.get(e.target).add(e.source);
});

// Sorted date axis for the timeline slider.
const DATES = Array.from(new Set(DATA.threads.map(t=>t.date).filter(Boolean))).sort();

const clusterColor = Object.fromEntries(DATA.clusters.map(c=>[c.name,c.color]));
document.getElementById("postCount").textContent = DATA.publication.post_count;

/* ===================== sidebar tabs ===================== */
document.querySelectorAll(".tab").forEach(t=>{
  t.addEventListener("click",()=>{
    document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
    t.classList.add("active");
    state.tab = t.dataset.tab;
    ["posts","concepts","paths","stats","quiz"].forEach(name=>{
      document.getElementById("panel-"+name).style.display = (name===state.tab)?"":"none";
    });
    writeHash();
  });
});

/* ===================== cluster filter pills ===================== */
const clusterFilter = document.getElementById("clusterFilter");
const allPill = document.createElement("div");
allPill.className="pill cluster active"; allPill.textContent="all clusters"; allPill.dataset.cluster="__all";
clusterFilter.appendChild(allPill);
DATA.clusters.forEach(c=>{
  const p=document.createElement("div");
  p.className="pill cluster"; p.textContent=c.name; p.dataset.cluster=c.name;
  p.style.borderColor=c.color;
  clusterFilter.appendChild(p);
});
clusterFilter.querySelectorAll(".pill").forEach(p=>{
  p.addEventListener("click",()=>{
    clusterFilter.querySelectorAll(".pill").forEach(x=>x.classList.remove("active"));
    p.classList.add("active");
    state.cluster = (p.dataset.cluster==="__all") ? null : p.dataset.cluster;
    if(state.cluster) p.style.background=clusterColor[state.cluster];
    clusterFilter.querySelectorAll(".pill").forEach(x=>{ if(!x.classList.contains("active")) x.style.background=""; });
    renderThreadList(); applyGraphFilters();
  });
});

    document.querySelectorAll("#diffFilter .pill").forEach(x=>x.classList.remove("active"));

    renderThreadList(); applyGraphFilters();
  });
});

/* ===================== search ===================== */
const searchInput=document.getElementById("searchInput");
searchInput.addEventListener("input",e=>{
  state.searchTerm = e.target.value.toLowerCase().trim();
  renderThreadList(); applyGraphFilters();
});

/* ===================== thread list ===================== */
function filteredThreads(){
  return DATA.threads.filter(t=>{
    if(state.diff!=="all" && t.difficulty!==state.diff) return false;
    if(state.cluster && t.cluster!==state.cluster) return false;
    if(state.mutedClusters.has(t.cluster)) return false;
    if(state.activeConcept && !t.concepts.includes(state.activeConcept)) return false;
    if(state.activePath){
      const p = DATA.learning_paths.find(p=>p.name===state.activePath);
      if(p && !p.threads.includes(t.id)) return false;
    }
    if(state.fromDate && t.date && t.date < state.fromDate) return false;
    if(state.searchTerm){
      const hay = (t.title+" "+t.summary+" "+t.concepts.join(" ")+" "+t.cluster).toLowerCase();
      if(!hay.includes(state.searchTerm)) return false;
    }
    return true;
  });
}
function renderThreadList(){
  const wrap = document.getElementById("threadList");
  const ts = filteredThreads();
  wrap.innerHTML = "";
  ts.slice(0,400).forEach(t=>{
    const el = document.createElement("div");
    el.className = "thread" + (state.selectedThread===t.id?" selected":"");
    el.innerHTML = `<div class="t-title">${escapeHtml(t.title)}</div>
      <div class="t-meta"><span style="color:${clusterColor[t.cluster]||'#888'}">●</span> ${escapeHtml(t.cluster)} · ${t.difficulty} · ${t.date||""}</div>
      <div class="t-tags">${t.concepts.slice(0,5).map(c=>`<span class="tag">${escapeHtml(c)}</span>`).join("")}</div>`;
    el.addEventListener("click",()=>selectThread(t.id));
    wrap.appendChild(el);
  });
  if(!ts.length) wrap.innerHTML='<div style="color:var(--text-dim);padding:14px;font-size:12px">No posts match those filters.</div>';
}

      state.activeConcept = (state.activeConcept===c.name) ? null : c.name;

}

/* ===================== graph ===================== */
const svg = d3.select("#graph");
const gRoot = svg.append("g");
const gLinks = gRoot.append("g").attr("class","links");
const gNodes = gRoot.append("g").attr("class","nodes");

let allNodes=[], allLinks=[], simulation, nodeSel, linkSel;

function buildGraph(){
  const threadNodes = DATA.threads.map(t=>({
    id:t.id, type:"thread", title:t.title, summary:t.summary,
    cluster:t.cluster, concepts:t.concepts, url:t.url, date:t.date,
    difficulty:t.difficulty, slug:t.slug,
    r: 5 + Math.min(7, t.concepts.length*0.9),
  }));
  const conceptNodes = DATA.concepts
    .filter(c=>c.count>=3)
    .slice(0, 36)
    .map(c=>({id:c.id, type:"concept", title:c.name, r: 3 + Math.sqrt(c.count)}));

  allNodes = threadNodes.concat(conceptNodes);

  const threadEdges = DATA.edges.map(e=>({source:e.source,target:e.target,weight:e.weight,kind:"thread"}));
  // concept->thread edges
  const conceptIds = new Set(conceptNodes.map(c=>c.id));
  const conceptByName = Object.fromEntries(DATA.concepts.map(c=>[c.name,c.id]));
  const conceptEdges = [];
  DATA.threads.forEach(t=>{
    t.concepts.forEach(name=>{
      const cid = conceptByName[name];
      if(cid && conceptIds.has(cid)){
        conceptEdges.push({source:t.id, target:cid, weight:.4, kind:"concept"});
      }
    });
  });
  allLinks = threadEdges.concat(conceptEdges);

  const W = svg.node().clientWidth, H = svg.node().clientHeight;

  // cluster centers around viewport
  const clusters = DATA.clusters.map(c=>c.name);
  const cx = (W/2), cy = (H/2), R = Math.min(W,H)*0.32;
  const clusterCenters = {};
  clusters.forEach((name,i)=>{
    const a = (i/clusters.length)*Math.PI*2 - Math.PI/2;
    clusterCenters[name] = {x: cx + R*Math.cos(a), y: cy + R*Math.sin(a)};
  });

  simulation = d3.forceSimulation(allNodes)
    .force("link", d3.forceLink(allLinks).id(d=>d.id).distance(d=>d.kind==="concept"?55:75).strength(d=>d.kind==="concept"?0.12:0.18))
    .force("charge", d3.forceManyBody().strength(d=>d.type==="thread"?-55:-25))
    .force("center", d3.forceCenter(cx, cy))
    .force("collide", d3.forceCollide().radius(d=>d.r+3))
    .force("cluster", function(alpha){
      allNodes.forEach(n=>{
        if(n.type!=="thread") return;
        const c = clusterCenters[n.cluster]; if(!c) return;
        n.vx += (c.x - n.x) * alpha * 0.12;
        n.vy += (c.y - n.y) * alpha * 0.12;
      });
    });

  linkSel = gLinks.selectAll("line").data(allLinks).enter().append("line")
    .attr("class", d=>"link"+(d.kind==="concept"?" concept":""))
    .attr("stroke-width", d=>d.kind==="concept"?0.6:Math.max(0.4, d.weight*1.6))
    .attr("stroke-dasharray", d=>d.kind==="concept"?"2,3":null);

  nodeSel = gNodes.selectAll("g.node").data(allNodes).enter().append("g")
    .attr("class", d=>"node "+(d.type==="concept"?"concept":"thread"))
    .call(d3.drag()
      .on("start",(e,d)=>{ if(!e.active) simulation.alphaTarget(.3).restart(); d.fx=d.x; d.fy=d.y; })
      .on("drag",(e,d)=>{ d.fx=e.x; d.fy=e.y; })
      .on("end",(e,d)=>{ if(!e.active) simulation.alphaTarget(0); d.fx=null; d.fy=null; }))
    .on("mouseenter",(e,d)=>{
      showTooltip(e,d);
      if(d.type==="thread"){ state.hoverThread = d.id; applyGraphFilters(); }
    })
    .on("mousemove",(e)=>moveTooltip(e))
    .on("mouseleave",()=>{
      hideTooltip();
      if(state.hoverThread){ state.hoverThread = null; applyGraphFilters(); }
    })
    .on("click",(e,d)=>{
      if(d.type==="thread") selectThread(d.id);
      else { state.activeConcept = (state.activeConcept===d.title)?null:d.title; renderConcepts(); renderThreadList(); applyGraphFilters(); }
    });

  nodeSel.append("circle")
    .attr("r", d=>d.r)
    .attr("fill", d=>d.type==="thread" ? (clusterColor[d.cluster]||"#888") : "#3a4554")
    .attr("stroke", d=>d.type==="concept"?"#76b7b2":"#0e1116");

  nodeSel.append("text")
    .attr("dx", d=>d.r+4)
    .attr("dy", "0.32em")
    .text(d=>d.type==="thread" ? trim(d.title, 36) : d.title);

  simulation.on("tick",()=>{
    linkSel
      .attr("x1",d=>d.source.x).attr("y1",d=>d.source.y)
      .attr("x2",d=>d.target.x).attr("y2",d=>d.target.y);
    nodeSel.attr("transform", d=>`translate(${d.x},${d.y})`);
  });

  // zoom & pan
  const zoom = d3.zoom().scaleExtent([0.25, 4])
    .on("zoom",(e)=>gRoot.attr("transform", e.transform));
  svg.call(zoom);
  window._zoom = zoom;
  window._svg = svg;
}

function trim(s,n){ return s.length>n ? s.slice(0,n-1)+"…" : s; }
function escapeHtml(s){ return (s==null?"":String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ===================== filtering / highlighting ===================== */
function applyGraphFilters(){
  if(!nodeSel) return;
  const visibleIds = new Set(filteredThreads().map(t=>t.id));
  const focus = state.hoverThread || state.selectedThread;
  const focusSet = focus ? new Set([focus, ...(NEIGHBORS.get(focus)||[])]) : null;

  nodeSel.classed("dimmed", d=>{
    if(d.type==="concept"){
      if(!state.showConcepts) return true;
      if(state.activeConcept && d.title!==state.activeConcept) return true;
      // when focusing a thread, dim concepts not attached to it
      if(focus){
        const t = DATA.threads.find(x=>x.id===focus);
        if(t && !t.concepts.includes(d.title)) return true;
      }
      return false;
    }
    if(state.mutedClusters.has(d.cluster)) return true;
    if(!visibleIds.has(d.id)) return true;
    if(focusSet && !focusSet.has(d.id)) return true;
    return false;
  });
  nodeSel.classed("highlighted", d=> d.type==="thread" && (state.selectedThread===d.id || state.hoverThread===d.id));
  nodeSel.style("display", d=>{
    if(d.type==="concept" && !state.showConcepts) return "none";
    return null;
  });
  linkSel.classed("dimmed", l=>{
    const sId = (l.source.id||l.source), tId = (l.target.id||l.target);
    const sNode = allNodes.find(n=>n.id===sId), tNode=allNodes.find(n=>n.id===tId);
    if(l.kind==="concept" && !state.showConcepts) return true;
    if(sNode && sNode.type==="thread" && !visibleIds.has(sId)) return true;
    if(tNode && tNode.type==="thread" && !visibleIds.has(tId)) return true;
    if(focus){
      const touchesFocus = (sId===focus || tId===focus);
      if(!touchesFocus) return true;
    }
    return false;
  }).classed("highlighted", l=>{
    if(!focus) return false;
    const sId = (l.source.id||l.source), tId = (l.target.id||l.target);
    return sId===focus || tId===focus;
  });
  nodeSel.select("text").style("display", state.showLabels?null:"none");
}

/* ===================== selection & detail panel ===================== */
function relatedThreads(id, k=5){
  const matched = DATA.edges
    .filter(e=>e.source===id || e.target===id)
    .map(e=>({other: e.source===id?e.target:e.source, w:e.weight, shared:e.shared}))
    .sort((a,b)=>b.w-a.w)
    .slice(0,k);
  return matched.map(m=>({t: DATA.threads.find(x=>x.id===m.other), w:m.w, shared:m.shared}))
                .filter(x=>x.t);
}

function selectThread(id){
  state.selectedThread = (state.selectedThread===id) ? null : id;
  const t = DATA.threads.find(t=>t.id===id);
  if(t && state.selectedThread){
    const related = relatedThreads(id, 5);
    const relHtml = related.length
      ? related.map(r=>`<div class="related-item" data-id="${r.t.id}">
          <div class="r-title">${escapeHtml(r.t.title)}</div>
          <div class="r-meta">${escapeHtml(r.t.cluster)} · ${r.shared} shared concepts · sim ${r.w.toFixed(2)}</div>
        </div>`).join("")
      : `<span style="color:var(--text-dim);font-size:11px">No graph neighbors above similarity threshold.</span>`;
    const dp = document.getElementById("detail-panel");
    dp.classList.add("show");
    dp.innerHTML = `<span class="dp-close" id="dpClose">×</span>
      <h2>${escapeHtml(t.title)}</h2>
      <div class="dp-meta">
        <span style="color:${clusterColor[t.cluster]||'#888'}">● ${escapeHtml(t.cluster)}</span>
        <span>${escapeHtml(t.difficulty)}</span>
        <span>${escapeHtml(t.date||"")}</span>
      </div>
      <div class="dp-summary">${escapeHtml(t.summary)}</div>
      <div class="dp-section">Concepts</div>
      <div>${t.concepts.map(c=>`<span class="tag" style="margin:2px 3px 2px 0;display:inline-block">${escapeHtml(c)}</span>`).join("") || "<span style='color:var(--text-dim);font-size:11px'>—</span>"}</div>
      <div class="dp-section">Related posts</div>
      <div id="dpRelated">${relHtml}</div>
      <a class="dp-link" target="_blank" rel="noopener" href="${t.url}">Open on Substack ↗</a>`;
    document.getElementById("dpClose").addEventListener("click",()=>{
      state.selectedThread=null;
      document.getElementById("detail-panel").classList.remove("show");
      writeHash();
      renderThreadList(); applyGraphFilters();
    });
    dp.querySelectorAll(".related-item").forEach(el=>{
      el.addEventListener("click",()=>selectThread(el.dataset.id));
    });
  } else {
    document.getElementById("detail-panel").classList.remove("show");
  }
  writeHash();
  renderThreadList();
  applyGraphFilters();
}

/* ===================== tooltip ===================== */
const tt = document.getElementById("tooltip");
function showTooltip(e,d){
  if(d.type==="thread"){
    tt.innerHTML = `<div class="tt-title">${escapeHtml(d.title)}</div>
      <div class="tt-meta">${escapeHtml(d.cluster)} · ${d.difficulty} · ${d.date||""}</div>
      <div style="margin-top:4px;color:#cbd6e2">${escapeHtml(d.summary).slice(0,160)}</div>`;
  } else {
    tt.innerHTML = `<div class="tt-title">${escapeHtml(d.title)}</div>
      <div class="tt-meta">Concept — click to filter</div>`;
  }
  tt.classList.add("show");
  moveTooltip(e);
}
function moveTooltip(e){
  const pad=12;
  tt.style.left=(e.clientX+pad)+"px";
  tt.style.top=(e.clientY+pad)+"px";
}
function hideTooltip(){ tt.classList.remove("show"); }

/* ===================== legend ===================== */
function renderLegend(){
  const lg = document.getElementById("legend");
  lg.innerHTML = "<div style='font-weight:600;margin-bottom:5px;color:var(--text)'>Clusters</div>";
  DATA.clusters.forEach(c=>{
    const row = document.createElement("div");
    row.className="lg-row";
    row.innerHTML=`<span class="lg-dot" style="background:${c.color}"></span><span>${escapeHtml(c.name)}</span>`;
    row.addEventListener("click",()=>{
      if(state.mutedClusters.has(c.name)) state.mutedClusters.delete(c.name);
      else state.mutedClusters.add(c.name);
      row.classList.toggle("muted", state.mutedClusters.has(c.name));
      applyGraphFilters();
    });
    lg.appendChild(row);
  });
}

/* ===================== controls ===================== */
document.getElementById("btnConcepts").addEventListener("click",e=>{
  state.showConcepts = !state.showConcepts;
  e.target.classList.toggle("on", state.showConcepts);
  applyGraphFilters();
});
document.getElementById("btnLabels").addEventListener("click",e=>{
  state.showLabels = !state.showLabels;
  e.target.classList.toggle("on", state.showLabels);
  applyGraphFilters();
});
document.getElementById("btnReset").addEventListener("click",()=>{
  window._svg.transition().duration(500).call(window._zoom.transform, d3.zoomIdentity);
  if(simulation) simulation.alpha(0.7).restart();
});

/* ===================== stats panel ===================== */
function renderStats(){
  const wrap = document.getElementById("panel-stats");
  const ts = DATA.threads;
  const total = ts.length;

  // Posts per cluster
  const clCount = {};
  DATA.clusters.forEach(c=>clCount[c.name]=0);
  ts.forEach(t=>clCount[t.cluster]=(clCount[t.cluster]||0)+1);
  const clMax = Math.max(...Object.values(clCount));
  const clRows = DATA.clusters
    .map(c=>({name:c.name,color:c.color,count:clCount[c.name]||0}))
    .sort((a,b)=>b.count-a.count)
    .map(c=>`<div class="bar-row">
      <div class="bar-label">${escapeHtml(c.name)}</div>
      <div class="bar-bg"><div class="bar-fill" style="width:${(c.count/clMax)*100}%;background:${c.color}"></div></div>
      <div class="bar-val">${c.count}</div>
    </div>`).join("");

  // Top concepts
  const topC = DATA.concepts.slice(0,15);
  const cMax = topC.length ? topC[0].count : 1;
  const cRows = topC.map(c=>`<div class="bar-row" data-concept="${escapeHtml(c.name)}">
      <div class="bar-label">${escapeHtml(c.name)}</div>
      <div class="bar-bg"><div class="bar-fill" style="width:${(c.count/cMax)*100}%;background:var(--accent)"></div></div>
      <div class="bar-val">${c.count}</div>
    </div>`).join("");

  // Posts per month
  const monthCount = {};
  ts.forEach(t=>{
    if(!t.date) return;
    const m = t.date.slice(0,7);
    monthCount[m] = (monthCount[m]||0)+1;
  });
  const months = Object.keys(monthCount).sort();
  const mMax = Math.max(...Object.values(monthCount),1);
  const mRows = months.map(m=>`<div class="bar-row">
      <div class="bar-label">${escapeHtml(m)}</div>
      <div class="bar-bg"><div class="bar-fill" style="width:${(monthCount[m]/mMax)*100}%;background:var(--accent-2)"></div></div>
      <div class="bar-val">${monthCount[m]}</div>
    </div>`).join("");

  // Difficulty mix
  const diffCount = {beginner:0,intermediate:0,advanced:0};
  ts.forEach(t=>diffCount[t.difficulty]=(diffCount[t.difficulty]||0)+1);
  const dMax = Math.max(...Object.values(diffCount),1);
  const dRows = Object.entries(diffCount).map(([k,v])=>`<div class="bar-row">
      <div class="bar-label">${k}</div>
      <div class="bar-bg"><div class="bar-fill" style="width:${(v/dMax)*100}%;background:#9c755f"></div></div>
      <div class="bar-val">${v}</div>
    </div>`).join("");

  wrap.innerHTML = `
    <div style="margin-bottom:14px;font-size:12px;color:var(--text-dim)">
      <b style="color:var(--text);font-size:14px">${total}</b> posts · <b style="color:var(--text)">${DATA.concepts.length}</b> concepts · <b style="color:var(--text)">${DATA.edges.length}</b> edges
    </div>
    <div class="stat-section"><h3>Posts per cluster</h3>${clRows}</div>
    <div class="stat-section"><h3>Top concepts (click to filter)</h3>${cRows}</div>
    <div class="stat-section"><h3>Posts per month</h3>${mRows}</div>
    <div class="stat-section"><h3>Difficulty mix</h3>${dRows}</div>`;

  wrap.querySelectorAll("[data-concept]").forEach(el=>{
    el.style.cursor="pointer";
    el.addEventListener("click",()=>{
      const c = el.dataset.concept;
      state.activeConcept = (state.activeConcept===c) ? null : c;
      // jump to concepts tab to show selection
      document.querySelector('.tab[data-tab="concepts"]').click();
      renderConcepts(); renderThreadList(); applyGraphFilters(); writeHash();
    });
  });
}

/* ===================== timeline slider ===================== */
function wireTimeline(){
  const slider = document.getElementById("tlSlider");
  const fromEl = document.getElementById("tlFrom");
  const toEl   = document.getElementById("tlTo");
  if(!DATES.length){ slider.disabled=true; fromEl.textContent="—"; toEl.textContent="—"; return; }
  slider.min = 0; slider.max = DATES.length-1; slider.value = 0;
  fromEl.textContent = DATES[0];
  toEl.textContent   = DATES[DATES.length-1];
  slider.addEventListener("input",e=>{
    const idx = parseInt(e.target.value,10);
    state.fromDate = DATES[idx];
    fromEl.textContent = state.fromDate;
    renderThreadList(); applyGraphFilters(); writeHash();
  });
}

/* ===================== URL hash state (shareable / persistent) ===================== */
function writeHash(){
  const parts = [];
  if(state.tab !== "posts")  parts.push("tab="+encodeURIComponent(state.tab));
  if(state.selectedThread)   parts.push("post="+encodeURIComponent(state.selectedThread));
  if(state.activeConcept)    parts.push("concept="+encodeURIComponent(state.activeConcept));
  if(state.activePath)       parts.push("path="+encodeURIComponent(state.activePath));
  if(state.cluster)          parts.push("cluster="+encodeURIComponent(state.cluster));
  if(state.diff!=="all")     parts.push("diff="+encodeURIComponent(state.diff));
  if(state.fromDate)         parts.push("from="+encodeURIComponent(state.fromDate));
  if(state.searchTerm)       parts.push("q="+encodeURIComponent(state.searchTerm));
  const next = parts.length ? ("#"+parts.join("&")) : "#";
  if(location.hash !== next) history.replaceState(null,"",next);
}
function readHash(){
  const h = location.hash.replace(/^#/,"");
  if(!h) return;
  const params = Object.fromEntries(h.split("&").map(kv=>kv.split("=").map(decodeURIComponent)));
  if(params.tab){
    const tab = document.querySelector(`.tab[data-tab="${params.tab}"]`);
    if(tab) tab.click();
  }
  if(params.diff){
    const p = document.querySelector(`#diffFilter .pill[data-diff="${params.diff}"]`);
    if(p) p.click();
  }
  if(params.cluster){
    const p = document.querySelector(`#clusterFilter .pill[data-cluster="${params.cluster}"]`);
    if(p) p.click();
  }
  if(params.concept){ state.activeConcept = params.concept; renderConcepts(); }
  if(params.path){    state.activePath    = params.path;    renderPaths(); }
  if(params.from){
    const i = DATES.indexOf(params.from);
    if(i>=0){ document.getElementById("tlSlider").value = i; state.fromDate = params.from; document.getElementById("tlFrom").textContent = params.from; }
  }
  if(params.q){
    state.searchTerm = params.q;
    document.getElementById("searchInput").value = params.q;
  }
  if(params.post){ selectThread(params.post); return; }
  renderThreadList(); applyGraphFilters();
}

/* ===================== bootstrap ===================== */
buildGraph();
renderThreadList();
renderConcepts();
renderPaths();
renderStats();
renderQuiz();
renderLegend();
wireTimeline();
applyGraphFilters();
readHash();
window.addEventListener("hashchange", readHash);

window.addEventListener("resize",()=>{
  if(!simulation) return;
  const W=svg.node().clientWidth, H=svg.node().clientHeight;
  simulation.force("center", d3.forceCenter(W/2, H/2));
  simulation.alpha(0.4).restart();
});
</script>
